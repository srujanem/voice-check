<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>AI Text Detector — AuthGuard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../global.css?v=3">
    <style>
        * { box-sizing: border-box; }
        body { overflow-x: hidden; position: relative; min-height: 100vh; }

        /* ── Animated Background Orbs ── */
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(100px); opacity: 0.18; pointer-events: none; z-index: 0; animation: floatOrb 12s ease-in-out infinite alternate; }
        .bg-orb-1 { width: 500px; height: 500px; background: #06b6d4; top: -100px; left: -150px; animation-duration: 14s; }
        .bg-orb-2 { width: 400px; height: 400px; background: #8b5cf6; bottom: -80px; right: -100px; animation-duration: 11s; animation-delay: -5s; }
        @keyframes floatOrb { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(40px, 30px) scale(1.1); } }

        .app-container { position: relative; z-index: 1; }

        /* ── Hero ── */
        .hero-section { text-align: center; padding: 40px 20px 30px; animation: fadeInUp 0.6s ease both; }
        .hero-icon-wrap { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, rgba(6,182,212,0.2), rgba(139,92,246,0.2)); border: 1px solid rgba(6,182,212,0.3); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; box-shadow: 0 0 30px rgba(6,182,212,0.25); }
        .hero-icon-wrap i { font-size: 32px; background: linear-gradient(135deg, #06b6d4, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-title { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #06b6d4, #8b5cf6, #f1f5f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 10px; }
        .hero-sub { color: #94a3b8; font-size: 1rem; margin: 0; }

        /* ── Glass Card ── */
        .glass-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 24px; margin-bottom: 20px; animation: fadeInUp 0.6s ease 0.15s both; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }

        /* ── Textarea ── */
        #textInput { width: 100%; height: 220px; padding: 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.25); color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 15px; resize: none; transition: border-color 0.3s, box-shadow 0.3s; outline: none; }
        #textInput::placeholder { color: #64748b; }
        #textInput:focus { border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6,182,212,0.15); }
        .word-counter { text-align: right; font-size: 12px; color: #64748b; margin-top: 8px; }

        /* ── Analyze Button ── */
        #btnAnalyze { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, #06b6d4, #8b5cf6); color: #fff; font-size: 16px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; animation: fadeInUp 0.6s ease 0.3s both; }
        #btnAnalyze:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(6,182,212,0.4); }
        #btnAnalyze:active { transform: translateY(0); }

        /* ── Loading ── */
        #loading-state { margin-top: 24px; text-align: center; }
        .loading-pulse { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #06b6d4, #8b5cf6); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(6,182,212,0.4); } 50% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(6,182,212,0); } }

        /* ── Results ── */
        #resultsSection { animation: fadeInUp 0.5s ease both; }
        .result-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 28px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3); position: relative; overflow: hidden; }
        .result-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #06b6d4, #8b5cf6); }
        .result-card.is-ai::before { background: linear-gradient(90deg, #ef4444, #f97316); }

        /* ── XAI Sentences ── */
        #xai-section { margin-top: 20px; padding: 16px; background: rgba(0,0,0,0.15); border-radius: 10px; text-align: left; font-size: 14px; line-height: 1.7; max-height: 220px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.06); }
        .ai-sentence { background: rgba(239,68,68,0.15); border-radius: 4px; padding: 2px 4px; color: #fca5a5; }
        .human-sentence { background: rgba(16,185,129,0.15); border-radius: 4px; padding: 2px 4px; color: #6ee7b7; }

        /* ── Confidence Ring ── */
        .confidence-ring { width: 120px; height: 120px; position: relative; margin: 20px auto; }
        .confidence-ring svg { transform: rotate(-90deg); }
        .confidence-ring circle { fill: none; stroke-width: 8; }
        .confidence-ring circle:first-child { stroke: rgba(255,255,255,0.08); }
        .confidence-ring circle.progress { stroke: #06b6d4; stroke-linecap: round; stroke-dasharray: 339.3; stroke-dashoffset: 339.3; transition: stroke-dashoffset 1.2s ease; }
        .confidence-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; }

        /* ── Prob bar ── */
        .prob-row { display: flex; justify-content: space-around; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); }
        .prob-item { text-align: center; }
        .prob-item .label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        .prob-item .value { font-size: 18px; font-weight: 700; }

        /* ── Buttons ── */
        #reset-btn, #download-pdf-btn { width: 100%; margin-top: 12px; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        #reset-btn:hover, #download-pdf-btn:hover { background: rgba(255,255,255,0.08); transform: translateY(-1px); }

        /* ── Error ── */
        #error-alert { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; color: #fca5a5; }

        /* ── Animations ── */
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

        /* ── Mobile ── */
        @media (max-width: 600px) {
            .hero-title { font-size: 1.5rem; }
            .hero-icon-wrap { width: 64px; height: 64px; }
            .hero-icon-wrap i { font-size: 24px; }
            #textInput { height: 180px; font-size: 16px; }
            .app-container { padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <div class="theme-toggle" id="themeToggle"><i class="fa-solid fa-sun"></i></div>

    <div class="app-container">
        <header class="app-header">
            <div class="logo-section">
                <i class="fa-solid fa-file-lines app-logo" style="font-size:28px;color:var(--accent-cyan);"></i>
                <div>
                    <h2>Text Detector</h2>
                    <p style="font-size:13px;color:#94a3b8;">Identify ChatGPT &amp; AI writing</p>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <div id="nav-auth"></div>
                <a href="../index.html" class="btn-secondary"><i class="fa-solid fa-house"></i> Home</a>
            </div>
        </header>

        <!-- Hero -->
        <div class="hero-section">
            <div class="hero-icon-wrap"><i class="fa-solid fa-file-lines"></i></div>
            <h1 class="hero-title">AI Text Detector</h1>
            <p class="hero-sub">Instantly detect ChatGPT, Claude &amp; AI-written content with sentence-level analysis</p>
        </div>

        <div id="error-alert" class="hidden">
            <i class="fa-solid fa-circle-exclamation"></i> <span id="error-message"></span>
        </div>

        <div id="input-section">
            <div class="glass-card">
                <textarea id="textInput" placeholder="Paste your essay, article, or text here to check if it was written by AI..."></textarea>
                <div class="word-counter"><span id="word-count-live">0</span> words</div>
            </div>
        </div>

        <button id="btnAnalyze">
            <i class="fa-solid fa-magnifying-glass"></i> Analyze Text
        </button>

        <div id="loading-state" class="hidden">
            <div class="loading-pulse"><i class="fa-solid fa-brain" style="font-size:24px;color:#fff;"></i></div>
            <p style="color:#94a3b8;margin:0;">Analyzing writing patterns...</p>
        </div>

        <div id="resultsSection" class="hidden" style="margin-top:24px;">
            <div class="result-card" id="result-card">
                <div class="result-icon-container" id="result-icon-box">
                    <i class="fa-solid fa-file-signature" id="result-icon"></i>
                </div>
                <h3 class="result-title" id="classificationResult">Human Written</h3>

                <div class="confidence-ring">
                    <svg viewBox="0 0 120 120" width="120" height="120">
                        <circle cx="60" cy="60" r="54"></circle>
                        <circle class="progress" cx="60" cy="60" r="54" id="scoreProgress"></circle>
                    </svg>
                    <div class="confidence-text" id="scorePercentage">0%</div>
                </div>

                <div class="prob-row">
                    <div class="prob-item">
                        <div class="label"><i class="fa-solid fa-user"></i> Human</div>
                        <div class="value" id="prob-human" style="color:#10b981;">--</div>
                    </div>
                    <div class="prob-item">
                        <div class="label"><i class="fa-solid fa-robot"></i> AI</div>
                        <div class="value" id="prob-ai" style="color:#ef4444;">--</div>
                    </div>
                </div>

                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;">
                    <span style="font-size:13px;color:#94a3b8;"><i class="fa-solid fa-align-left"></i> Words: <strong id="word-count">--</strong></span>
                    <span id="confidence-label" style="font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(99,102,241,0.15);color:var(--accent-cyan);">--</span>
                </div>

                <div id="xai-section" style="margin-top:20px;"></div>
            </div>

            <button id="reset-btn"><i class="fa-solid fa-rotate-right"></i> Check New Text</button>
            <button id="download-pdf-btn"><i class="fa-solid fa-file-pdf"></i> Download PDF Report</button>
        </div>
    </div>

    <script>
        // Live word counter
        const ta = document.getElementById('textInput');
        const wc = document.getElementById('word-count-live');
        if (ta && wc) ta.addEventListener('input', () => {
            const words = ta.value.trim().split(/\s+/).filter(Boolean).length;
            wc.textContent = words;
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="../theme.js?v=6"></script>
    <script src="../history.js?v=6"></script>
    <script src="../server-config.js?v=6"></script>
    <script src="../auth.js?v=1"></script>
    <script>document.addEventListener('DOMContentLoaded',()=>injectNavAuthState(document.getElementById('nav-auth')));</script>
    <script src="script.js?v=6"></script>
</body>
</html>
