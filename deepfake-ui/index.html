<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Image Detection — AI vs Human</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../global.css?v=2">
</head>
<body>
    <div class="theme-toggle" id="themeToggle"><i class="fa-solid fa-sun"></i></div>
    <div class="app-container">
        
        <header class="app-header">
            <div class="logo-section">
                <img src="../assets/image_logo.png" alt="Image Detector Logo" class="app-logo">
                <div>
                    <h2>Image Detector</h2>
                    <p style="font-size: 14px;">Spot AI-generated faces</p>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <div id="nav-auth"></div>
                <a href="../index.html" class="btn-secondary">
                    <i class="fa-solid fa-house"></i> Home
                </a>
            </div>
        </header>

        <div id="error-alert" class="hidden" style="background: var(--color-error); padding: 10px; border-radius: 8px; margin-bottom: 20px; color: white;">
            <i class="fa-solid fa-circle-exclamation"></i> <span id="error-message"></span>
        </div>

        <div id="input-section">
            <div id="upload-area" class="input-area active">
                <div class="upload-area" id="drop-zone">
                    <i class="fa-solid fa-image upload-icon"></i>
                    <h3>Drag & Drop Image</h3>
                    <p>PNG, JPG, or JPEG</p>
                    <input type="file" id="fileInput" accept="image/*,image/jpeg,image/png,image/webp,.heic,.heif" hidden>
                    <button class="btn-secondary" onclick="document.getElementById('fileInput').click()" style="margin-top: 15px;">Browse Files</button>
                </div>
            </div>

            <div id="imagePreviewContainer" class="hidden" style="text-align: center; margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; position: relative; overflow: hidden;">
                <img id="imagePreview" src="" alt="Preview" style="max-width: 100%; max-height: 300px; border-radius: 8px;">
                <div class="scanner-line hidden" id="scannerLine" style="position: absolute; top:0; left:0; width:100%; height:2px; background: var(--accent-cyan); box-shadow: 0 0 10px 2px var(--accent-cyan); animation: scan 2s infinite ease-in-out;"></div>
                <button id="btnRemove" class="btn-secondary" style="margin-top: 10px; position: relative; z-index: 10;">Remove Image</button>
            </div>
        </div>

        <button id="btnAnalyze" class="btn-primary disabled" disabled>
            <i class="fa-solid fa-microchip"></i> Analyze Image
        </button>

        <div id="loading-state" class="hidden text-center" style="margin-top: 20px;">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 30px; color: var(--accent-cyan); margin-bottom: 10px;"></i>
            <p>Scanning pixel gradients...</p>
        </div>

        <div id="resultsSection" class="hidden">
            <div class="result-card" id="result-card">
                <div class="result-icon-container" id="result-icon-box">
                    <i class="fa-solid fa-image" id="result-icon"></i>
                </div>
                <h3 class="result-title" id="classificationResult">Authentic Image</h3>
                
                <div class="confidence-ring">
                    <svg>
                        <circle cx="60" cy="60" r="54"></circle>
                        <circle class="progress" cx="60" cy="60" r="54" id="scoreProgress"></circle>
                    </svg>
                    <div class="confidence-text" id="scorePercentage">0%</div>
                </div>

                <div style="display: flex; justify-content: space-around; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color);">
                    <span id="prob-real">Real: --</span>
                    <span id="prob-fake">Fake: --</span>
                </div>

                <!-- ===== ANIMATED CONFIDENCE CHART ===== -->
                <div id="confidence-chart" style="margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border-color);">
                    <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 14px;">Confidence Breakdown</div>
                    <div style="margin-bottom: 12px;">
                        <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px;">
                            <span style="color: #10b981;"><i class="fa-solid fa-image"></i> Real Image</span>
                            <span id="chart-real-label" style="color: #10b981; font-weight: 700;">0%</span>
                        </div>
                        <div style="height: 10px; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden;">
                            <div id="chart-real-bar" style="height: 100%; width: 0%; background: linear-gradient(90deg, #10b981, #34d399); border-radius: 999px; transition: width 1.5s cubic-bezier(0.25, 1, 0.5, 1);"></div>
                        </div>
                    </div>
                    <div>
                        <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px;">
                            <span style="color: #ef4444;"><i class="fa-solid fa-robot"></i> AI Generated</span>
                            <span id="chart-fake-label" style="color: #ef4444; font-weight: 700;">0%</span>
                        </div>
                        <div style="height: 10px; background: rgba(255,255,255,0.06); border-radius: 999px; overflow: hidden;">
                            <div id="chart-fake-bar" style="height: 100%; width: 0%; background: linear-gradient(90deg, #ef4444, #f87171); border-radius: 999px; transition: width 1.5s cubic-bezier(0.25, 1, 0.5, 1);"></div>
                        </div>
                    </div>
                </div>
            </div>

            <button id="reset-btn" class="btn-secondary" style="width: 100%; margin-top: 20px; justify-content: center;" onclick="document.getElementById('btnRemove').click()">
                <i class="fa-solid fa-rotate-right"></i> Analyze Another
            </button>
            <button id="download-pdf-btn" class="btn-secondary" style="width: 100%; margin-top: 10px; justify-content: center;">
                <i class="fa-solid fa-file-pdf"></i> Download PDF Report
            </button>
            </div>

    </div>

    <style>
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="../theme.js?v=6"></script>
    <script src="../history.js?v=6"></script>
    <script src="../server-config.js?v=6"></script>
    <script src="../auth.js?v=1"></script>
    <script>document.addEventListener('DOMContentLoaded',()=>injectNavAuthState(document.getElementById('nav-auth')));</script>
    <script>
    document.getElementById('download-pdf-btn') && document.getElementById('download-pdf-btn').addEventListener('click', function() {
        if (typeof html2pdf !== 'undefined') {
            html2pdf().set({ margin: 10, filename: 'AuthGuard_Image_Report.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' } })
                .from(document.getElementById('result-card')).save();
        } else { alert('PDF library not loaded. Check your internet connection.'); }
    });
    </script>
    <script>
    // Inline fallback — guarantees cache cannot break the image uploader
    document.addEventListener('DOMContentLoaded', function () {
        var uploadArea            = document.getElementById('upload-area');
        var fileInput             = document.getElementById('fileInput');
        var imagePreviewContainer = document.getElementById('imagePreviewContainer');
        var imagePreview          = document.getElementById('imagePreview');
        var btnRemove             = document.getElementById('btnRemove');
        var btnAnalyze            = document.getElementById('btnAnalyze');
        var scannerLine           = document.getElementById('scannerLine');
        var loadingState          = document.getElementById('loading-state');
        var resultsSection        = document.getElementById('resultsSection');
        var scoreProgress         = document.getElementById('scoreProgress');
        var scorePercentage       = document.getElementById('scorePercentage');
        var resultCard            = document.getElementById('result-card');
        var classificationResult  = document.getElementById('classificationResult');
        var probReal              = document.getElementById('prob-real');
        var probFake              = document.getElementById('prob-fake');
        var currentFile = null;

        function setFile(file) {
            currentFile = file;
            var reader = new FileReader();
            reader.onloadend = function () {
                imagePreview.src = reader.result;
                uploadArea.classList.add('hidden');
                imagePreviewContainer.classList.remove('hidden');
                btnAnalyze.classList.remove('disabled');
                btnAnalyze.disabled = false;
                resultsSection.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        // File picker via Browse button
        fileInput.addEventListener('change', function () {
            if (this.files && this.files.length > 0) setFile(this.files[0]);
        });

        // Drag and drop
        ['dragenter','dragover','dragleave','drop'].forEach(function(evt) {
            document.getElementById('drop-zone').addEventListener(evt, function(e) { e.preventDefault(); e.stopPropagation(); });
        });
        document.getElementById('drop-zone').addEventListener('drop', function(e) {
            var files = e.dataTransfer.files;
            if (files && files.length > 0) setFile(files[0]);
        });

        // Remove
        btnRemove.addEventListener('click', function(e) {
            e.stopPropagation();
            currentFile = null;
            fileInput.value = '';
            uploadArea.classList.remove('hidden');
            imagePreviewContainer.classList.add('hidden');
            btnAnalyze.classList.add('disabled');
            btnAnalyze.disabled = true;
            resultsSection.classList.add('hidden');
        });

        // Analyze
        btnAnalyze.addEventListener('click', async function() {
            if (btnAnalyze.disabled || !currentFile) return;
            if (scannerLine) scannerLine.classList.remove('hidden');
            btnAnalyze.style.display = 'none';
            loadingState.classList.remove('hidden');
            resultsSection.classList.add('hidden');

            var formData = new FormData();
            formData.append('file', currentFile);
            formData.append('type', 'image');

            try {
                var backendUrl = (window.AUTHGUARD_BACKEND_URL || localStorage.getItem('zrok_url') || 'http://localhost:5000').replace(/\/$/, '');
                if (backendUrl === 'http://localhost:8000') backendUrl = 'http://localhost:5000';

                var response = await fetch(backendUrl + '/api/infer', { method: 'POST', body: formData, headers: window.getAuthHeaders ? window.getAuthHeaders() : {} });
                if (!response.ok) {
                    var ed = await response.json();
                    throw new Error(ed.error || 'Server error ' + response.status);
                }
                var data = await response.json();

                if (scannerLine) scannerLine.classList.add('hidden');
                loadingState.classList.add('hidden');
                btnAnalyze.style.display = 'inline-flex';
                showResults(data);
            } catch(err) {
                if (scannerLine) scannerLine.classList.add('hidden');
                loadingState.classList.add('hidden');
                btnAnalyze.style.display = 'inline-flex';
                alert('Analysis failed: ' + err.message);
            }
        });

        function animateCountUp(el, target, duration, prefix, suffix) {
            if (!el) return;
            prefix = prefix || ''; suffix = suffix !== undefined ? suffix : '%';
            var num = parseFloat(target);
            if (isNaN(num)) { el.textContent = prefix + target + suffix; return; }
            var start = 0, inc = num / (duration / 16);
            var t = setInterval(function() {
                start += inc;
                if (start >= num) { start = num; clearInterval(t); }
                el.textContent = prefix + start.toFixed(1) + suffix;
            }, 16);
        }

        function showResults(data) {
            resultsSection.classList.remove('hidden');
            var inner = data.analysis || data;
            var isFake = data.is_ai !== undefined ? data.is_ai
                : (String(inner.prediction || '').toLowerCase().includes('ai') || String(inner.prediction || '').toLowerCase().includes('fake'));
            var rawConf = data.confidence !== undefined ? data.confidence : inner.confidence;
            if (rawConf !== undefined && rawConf <= 1 && rawConf > 0) rawConf = rawConf * 100;
            var confidence = Math.round(rawConf || 50);
            var realPct = inner.prob_human !== undefined ? Math.round(inner.prob_human) : (isFake ? 100 - confidence : confidence);
            var fakePct = inner.prob_ai   !== undefined ? Math.round(inner.prob_ai)    : (isFake ? confidence : 100 - confidence);

            if (resultCard) resultCard.className = 'result-card';
            setTimeout(function() {
                var icon = document.getElementById('result-icon');
                if (!isFake) {
                    if (resultCard) resultCard.classList.add('status-authentic');
                    if (classificationResult) classificationResult.textContent = 'Authentic Image';
                    if (icon) icon.className = 'fa-solid fa-user-check';
                } else {
                    if (resultCard) resultCard.classList.add('status-fake');
                    if (classificationResult) classificationResult.textContent = 'AI-Generated Image';
                    if (icon) icon.className = 'fa-solid fa-robot';
                }
                animateCountUp(scorePercentage, confidence, 1500);
                if (scoreProgress) {
                    var circ = 339.292;
                    scoreProgress.style.strokeDashoffset = circ - (confidence/100)*circ;
                }
                animateCountUp(probReal, realPct, 1500, 'Real: ');
                animateCountUp(probFake, fakePct, 1500, 'Fake: ');
                var rb = document.getElementById('chart-real-bar'), fb = document.getElementById('chart-fake-bar');
                var rl = document.getElementById('chart-real-label'), fl = document.getElementById('chart-fake-label');
                if (rb) { rb.style.width='0%'; fb.style.width='0%';
                    setTimeout(function(){
                        rb.style.width = realPct+'%'; fb.style.width = fakePct+'%';
                        animateCountUp(rl, realPct, 1500, '', '%'); animateCountUp(fl, fakePct, 1500, '', '%');
                    }, 120);
                }
                if (typeof scanHistory !== 'undefined' && scanHistory)
                    scanHistory.addScan('Image', currentFile ? currentFile.name : 'Image', isFake, confidence);
            }, 50);
        }
    });
    </script>
</body>
</html>
