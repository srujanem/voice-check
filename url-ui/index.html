<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>URL Scanner — AuthGuard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="/global.css?v=20260825">
    <style>
        * { box-sizing: border-box; }
        body { overflow-x: hidden; position: relative; min-height: 100vh; }

        .bg-orb { position: fixed; border-radius: 50%; filter: blur(110px); opacity: 0.15; pointer-events: none; z-index: 0; animation: floatOrb 13s ease-in-out infinite alternate; }
        .bg-orb-1 { width: 550px; height: 550px; background: #06b6d4; top: -120px; right: -150px; }
        .bg-orb-2 { width: 420px; height: 420px; background: #8b5cf6; bottom: -60px; left: -100px; animation-delay: -6s; }
        @keyframes floatOrb { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(35px, 25px) scale(1.08); } }

        .app-container { position: relative; z-index: 1; }

        /* Hero */
        .hero-section { text-align: center; padding: 40px 20px 28px; animation: fadeInUp 0.6s ease both; }
        .hero-icon-wrap { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, rgba(6,182,212,0.2), rgba(139,92,246,0.2)); border: 1px solid rgba(6,182,212,0.3); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; animation: radarPulse 2.5s ease-in-out infinite; }
        @keyframes radarPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(6,182,212,0.5), 0 0 20px rgba(6,182,212,0.2); } 50% { box-shadow: 0 0 0 16px rgba(6,182,212,0), 0 0 30px rgba(6,182,212,0.3); } }
        .hero-icon-wrap i { font-size: 32px; background: linear-gradient(135deg, #06b6d4, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-title { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #06b6d4, #8b5cf6, #f1f5f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 10px; }
        .hero-sub { color: #94a3b8; font-size: 1rem; margin: 0; }

        /* Glass Card */
        .glass-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 24px; margin-bottom: 20px; animation: fadeInUp 0.6s ease 0.15s both; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }

        /* URL Input Area */
        .url-input-wrap { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 4px 16px 4px 4px; transition: border-color 0.3s, box-shadow 0.3s; }
        .url-input-wrap:focus-within { border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6,182,212,0.15); }
        .url-input-icon { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, #06b6d4, #8b5cf6); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .url-input-icon i { color: #fff; font-size: 18px; }
        #urlInput { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 16px; padding: 12px 0; }
        #urlInput::placeholder { color: #64748b; }

        /* Button */
        #btnAnalyze { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, #06b6d4, #8b5cf6); color: #fff; font-size: 16px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; animation: fadeInUp 0.6s ease 0.3s both; margin-top: 4px; }
        #btnAnalyze:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(6,182,212,0.4); }
        #btnAnalyze:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Loading Steps */
        #loading-state { margin-top: 24px; text-align: center; }
        .scan-steps { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
        .scan-step { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #94a3b8; padding: 6px 12px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); }
        .scan-step.active { color: #06b6d4; border-color: rgba(6,182,212,0.3); background: rgba(6,182,212,0.08); }
        .scan-step .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: blink 1s ease-in-out infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
        .loading-pulse { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #06b6d4, #8b5cf6); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(6,182,212,0.4); } 50% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(6,182,212,0); } }

        /* Results */
        #resultsSection { animation: fadeInUp 0.5s ease both; margin-top: 24px; }
        .result-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 28px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.3); position: relative; overflow: hidden; }
        .result-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #06b6d4, #8b5cf6); }
        .result-card.is-ai::before { background: linear-gradient(90deg, #ef4444, #f97316); }

        /* Confidence Ring */
        .confidence-ring { width: 120px; height: 120px; position: relative; margin: 20px auto; }
        .confidence-ring svg { transform: rotate(-90deg); }
        .confidence-ring circle { fill: none; stroke-width: 8; }
        .confidence-ring circle:first-child { stroke: rgba(255,255,255,0.08); }
        .confidence-ring circle.progress { stroke: #06b6d4; stroke-linecap: round; stroke-dasharray: 339.3; stroke-dashoffset: 339.3; transition: stroke-dashoffset 1.2s ease; }
        .confidence-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; }

        .prob-row { display: flex; justify-content: space-around; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); }

        /* Preview */
        #preview-section { margin-top: 20px; padding: 16px 20px; background: rgba(139,92,246,0.07); border-left: 3px solid #8b5cf6; border-radius: 0 10px 10px 0; text-align: left; font-size: 13px; line-height: 1.6; color: #94a3b8; font-style: italic; }

        #reset-btn, #download-pdf-btn { width: 100%; margin-top: 12px; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        #reset-btn:hover, #download-pdf-btn:hover { background: rgba(255,255,255,0.08); transform: translateY(-1px); }

        #error-alert { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; color: #fca5a5; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 600px) {
            .hero-title { font-size: 1.5rem; }
            .scan-steps { gap: 6px; }
            .scan-step { font-size: 11px; padding: 5px 8px; }
        }

        /* MOBILE FIXES */
        @media (max-width: 480px) {
          .app-header { flex-wrap: wrap; gap: 8px; }
          .app-header > div:last-child { gap: 6px !important; }
          .app-header .btn-secondary .btn-label { display: none; }
          .app-header .btn-secondary { padding: 8px 10px !important; min-width: 36px; }
          #connectWalletBtn { padding: 8px 10px !important; font-size: 0 !important; }
          #connectWalletBtn i { font-size: 14px !important; margin: 0 !important; }
          #urlInput, input[type=url], input[type=text] { font-size: 16px !important; /* prevents iOS zoom */ }
          .btn-primary, .btn-secondary { min-height: 44px; }
          .app-container { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
          .preview-section, .url-preview { font-size: 13px !important; }
        }
    </style>
</head>
<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <div class="theme-toggle" id="themeToggle"><i class="fa-solid fa-sun"></i></div>

    <div class="app-container">
        <header class="app-header">
            <div class="logo-section">
                <i class="fa-solid fa-link app-logo" style="font-size:28px;color:var(--accent-cyan);"></i>
                <div>
                    <h2>URL Scanner</h2>
                    <p style="font-size:13px;color:#94a3b8;">Analyze web content directly</p>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
                <div id="nav-auth"></div>
                <a href="/index.html?v=1787591944" class="btn-secondary"><i class="fa-solid fa-house"></i> <span class="btn-label">Home</span></a>
            </div>
        </header>

        <!-- Hero -->
        <div class="hero-section">
            <div class="hero-icon-wrap"><i class="fa-solid fa-satellite-dish"></i></div>
            <h1 class="hero-title">URL Content Scanner</h1>
            <p class="hero-sub">Analyze any article or web page for AI-generated content instantly</p>
        </div>

        <div id="error-alert" class="hidden">
            <i class="fa-solid fa-circle-exclamation"></i> <span id="error-message"></span>
        </div>

        <div id="input-section">
            <div class="glass-card">
                <p style="margin:0 0 14px;font-size:14px;color:#94a3b8;"><i class="fa-solid fa-link" style="color:#06b6d4;"></i>&nbsp; Paste a news article or blog URL below</p>
                <div class="url-input-wrap">
                    <div class="url-input-icon"><i class="fa-solid fa-satellite-dish"></i></div>
                    <input type="url" id="urlInput" placeholder="https://example.com/article..." inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false">
                </div>
            </div>
        </div>

        <button id="btnAnalyze" class="disabled" disabled>
            <i class="fa-solid fa-satellite-dish"></i> Scan Link
        </button>

        <div id="loading-state" class="hidden">
            <div class="loading-pulse"><i class="fa-solid fa-satellite-dish" style="font-size:24px;color:#fff;"></i></div>
            <p style="color:#94a3b8;margin:0 0 12px;">Scanning and analyzing content...</p>
            <div class="scan-steps">
                <div class="scan-step active"><span class="dot"></span> Fetching</div>
                <i class="fa-solid fa-chevron-right" style="color:#475569;font-size:10px;"></i>
                <div class="scan-step"><span class="dot"></span> Extracting</div>
                <i class="fa-solid fa-chevron-right" style="color:#475569;font-size:10px;"></i>
                <div class="scan-step"><span class="dot"></span> Analyzing</div>
            </div>
        </div>

        <div id="resultsSection" class="hidden">
            <div class="result-card" id="result-card">
                <div class="result-icon-container" id="result-icon-box">
                    <i class="fa-solid fa-globe" id="result-icon"></i>
                </div>
                <h3 class="result-title" id="classificationResult">Authentic Content</h3>

                <div class="confidence-ring">
                    <svg viewBox="0 0 120 120" width="120" height="120">
                        <circle cx="60" cy="60" r="54"></circle>
                        <circle class="progress" cx="60" cy="60" r="54" id="scoreProgress"></circle>
                    </svg>
                    <div class="confidence-text" id="scorePercentage">0%</div>
                </div>

                <div class="prob-row">
                    <span id="prob-human" style="color:#10b981;font-weight:600;">Human: --</span>
                    <span id="prob-ai" style="color:#ef4444;font-weight:600;">AI: --</span>
                </div>

                <div id="preview-section"></div>
            </div>

            <button id="reset-btn"><i class="fa-solid fa-rotate-right"></i> Scan Another URL</button>
            <button id="download-pdf-btn"><i class="fa-solid fa-file-pdf"></i> Download PDF Report</button>
        </div>
    </div>

    <script src="/theme.js?v=1787591944"></script>
    <script src="/history.js?v=1787591944"></script>
    <script src="/server-config.js?v=1787591944"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="/auth.js?v=1787591944"></script>
    <script>document.addEventListener('DOMContentLoaded',()=>injectNavAuthState(document.getElementById('nav-auth')));</script>
    <script src="/url-ui/script.js?v=1787591944"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    if (window.injectNavAuthState) {
        window.injectNavAuthState(document.getElementById('nav-auth-mobile'));
    }
});
</script>
<script src="/pdf-report.js?v=1"></script>
<script src="/motion-3d.js?v=1787591944"></script>
</body>
</html>
