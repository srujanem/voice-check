<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live WebRTC Scanner — AuthGuard AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/global.css?v=20260825">
    <link rel="stylesheet" href="style.css?v=20260825">
</head>
<body data-theme="dark">
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <a href="/index.html?v=20260825" class="nav-brand">
            <div class="logo-icon" style="background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 24px;">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <span>AuthGuard</span>
        </a>
        <div class="nav-right">
            <div id="nav-auth"></div>
            <div class="theme-toggle" id="themeToggle"><i class="fa-solid fa-sun"></i></div>
        </div>
    </nav>

    <div class="app-container">
        <!-- Hero Section -->
        <section class="hero-section">
            <div class="hero-bg-orbs">
                <div class="hero-orb-1"></div>
                <div class="hero-orb-2"></div>
            </div>
            
            <div class="hero-icon-box">
                <i class="fa-solid fa-video"></i>
            </div>
            <h1 class="section-title">Live <span class="gradient-text">WebRTC</span> Scanner</h1>
            <p class="section-subtitle">Real-time deepfake and voice cloning detection directly from your webcam.</p>
        </section>

        <!-- Live Scanner UI -->
        <section class="live-scanner-section">
            <div class="scanner-glass-card">
                
                <div class="video-wrapper">
                    <!-- The actual webcam feed -->
                    <video id="webcam" autoplay playsinline muted></video>
                    <canvas id="captureCanvas" style="display:none;"></canvas>

                    <!-- HUD Overlay -->
                    <div class="hud-overlay" id="hudOverlay">
                        <div class="hud-header">
                            <div class="rec-indicator">
                                <div class="rec-dot"></div> LIVE SCAN
                            </div>
                            <div class="hud-timer" id="hudTimer">00:00:00</div>
                        </div>

                        <!-- Face tracking bounding box (simulated UI) -->
                        <div class="tracking-box" id="trackingBox">
                            <div class="tracking-corner top-left"></div>
                            <div class="tracking-corner top-right"></div>
                            <div class="tracking-corner bottom-left"></div>
                            <div class="tracking-corner bottom-right"></div>
                        </div>

                        <div class="hud-footer">
                            <div class="hud-stat-box">
                                <span class="hud-label">FRAME ANALYSIS</span>
                                <span class="hud-value" id="hudVisualRes">Waiting...</span>
                            </div>
                            <div class="hud-stat-box">
                                <span class="hud-label">AI PROBABILITY</span>
                                <span class="hud-value" id="hudProb">0%</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Pre-start overlay -->
                    <div class="pre-start-overlay" id="preStartOverlay">
                        <i class="fa-solid fa-camera-web" style="font-size: 48px; color: var(--accent-cyan); margin-bottom: 20px;"></i>
                        <h3>Camera Access Required</h3>
                        <p>We need access to your webcam and microphone to perform real-time forensic scanning.</p>
                        <button class="btn-primary" id="startBtn">
                            <i class="fa-solid fa-power-off"></i> Start Live Scan
                        </button>
                    </div>
                </div>

                <div class="scanner-controls">
                    <button class="btn-secondary" id="stopBtn" style="display:none; border-color: var(--accent-red); color: var(--accent-red);">
                        <i class="fa-solid fa-stop"></i> Stop Scanning
                    </button>
                    <div id="connectionStatus" class="connection-status">
                        <i class="fa-solid fa-circle-check" style="color: var(--accent-green);"></i> Backend Connected
                    </div>
                </div>

            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/server-config.js?v=20260825"></script>
    <script src="/auth.js?v=20260825"></script>
    <script src="/theme.js?v=20260825"></script>
    <script src="script.js?v=20260825"></script>
</body>
</html>
