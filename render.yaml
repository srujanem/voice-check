services:
  - type: web
    name: voicecheck-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python download_models.py && gunicorn run:app --workers 2 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MODEL_VOICE_URL
        sync: false
      - key: MODEL_SCALER_URL
        sync: false
      - key: MODEL_IMAGE_URL
        sync: false
      - key: MODEL_TEXT_URL
        sync: false
      - key: MODEL_VECTZ_URL
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
