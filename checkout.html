<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthGuard - Secure Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0a0a0f;
            --bg-card: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg-main); 
            color: var(--text-primary); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }
        .checkout-container {
            display: flex;
            background: #12121a;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            margin: 20px;
        }
        .order-summary {
            background: linear-gradient(135deg, rgba(6,182,212,0.1), rgba(139,92,246,0.1));
            padding: 40px;
            flex: 1;
            border-right: 1px solid var(--border-color);
        }
        .payment-section {
            padding: 40px;
            flex: 1.5;
            background: #12121a;
        }
        h2 { margin-top: 0; font-size: 24px; font-weight: 700; margin-bottom: 30px; }
        .plan-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .plan-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }
        .plan-price { font-size: 32px; font-weight: 800; color: white; margin-bottom: 10px; }
        .plan-price span { font-size: 16px; color: var(--text-secondary); font-weight: 500; }
        ul.features { list-style: none; padding: 0; margin-top: 30px; }
        ul.features li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text-secondary); margin-bottom: 12px; }
        ul.features li i { color: #10b981; }
        
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
        input { 
            width: 100%; 
            padding: 14px; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            color: white; 
            font-family: inherit; 
            font-size: 14px; 
            box-sizing: border-box;
            transition: all 0.2s;
        }
        input:focus { outline: none; border-color: var(--accent-cyan); background: rgba(255,255,255,0.1); }
        .row { display: flex; gap: 15px; }
        .row .input-group { flex: 1; }
        
        .pay-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(6,182,212,0.3);
        }
        .pay-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(6,182,212,0.5); }
        
        .stripe-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 20px;
        }
        
        @media (max-width: 768px) {
            .checkout-container { flex-direction: column; }
            .order-summary { border-right: none; border-bottom: 1px solid var(--border-color); }
        }
    </style>
</head>
<body>

<div class="checkout-container">
    <div class="order-summary">
        <a href="pricing.html" style="color: var(--text-secondary); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 8px; margin-bottom: 30px;"><i class="fa-solid fa-arrow-left"></i> Back</a>
        
        <div class="plan-header">
            <div class="plan-icon"><i class="fa-solid fa-crown"></i></div>
            <div>
                <h3 style="margin:0; font-size:20px; color:white;">AuthGuard Pro</h3>
                <div style="color:var(--text-secondary); font-size:14px; margin-top:4px;">Billed monthly</div>
            </div>
        </div>
        
        <div class="plan-price">.00<span>/mo</span></div>
        
        <ul class="features">
            <li><i class="fa-solid fa-check"></i> Unlimited AI Scans</li>
            <li><i class="fa-solid fa-check"></i> Full Scan History Dashboard</li>
            <li><i class="fa-solid fa-check"></i> PDF Report Generation</li>
            <li><i class="fa-solid fa-check"></i> Priority Processing Speed</li>
        </ul>
    </div>
    
    <div class="payment-section">
        <h2>Payment Details</h2>
        <form id="checkout-form" onsubmit="processPayment(event)">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            
            <div class="input-group">
                <label>Card Information</label>
                <div style="position: relative;">
                    <input type="text" placeholder="0000 0000 0000 0000" maxlength="19" required style="padding-left: 45px;">
                    <i class="fa-regular fa-credit-card" style="position: absolute; left: 15px; top: 16px; color: var(--text-secondary);"></i>
                </div>
            </div>
            
            <div class="row">
                <div class="input-group">
                    <label>Expiry Date</label>
                    <input type="text" placeholder="MM/YY" maxlength="5" required>
                </div>
                <div class="input-group">
                    <label>CVC</label>
                    <input type="text" placeholder="123" maxlength="4" required>
                </div>
            </div>
            
            <div class="input-group">
                <label>Name on Card</label>
                <input type="text" placeholder="John Doe" required>
            </div>
            
            <button type="submit" class="pay-btn" id="payBtn">Pay .00</button>
            
            <div class="stripe-badge">
                <i class="fa-solid fa-lock"></i> Secured by <strong>Stripe</strong>
            </div>
        </form>
    </div>
</div>

<script src="auth.js"></script>
<script>
    // Pre-fill email if logged in
    document.addEventListener('DOMContentLoaded', () => {
        if(window.getCurrentUser) {
            const user = window.getCurrentUser();
            if(user && user.email) {
                document.getElementById('email').value = user.email;
            }
        }
    });

    function processPayment(e) {
        e.preventDefault();
        const btn = document.getElementById('payBtn');
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';
        btn.style.opacity = '0.8';
        
        setTimeout(() => {
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Payment Successful!';
            btn.style.background = '#10b981';
            
            // Upgrade user local flag
            localStorage.setItem('is_pro_user', 'true');
            
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        }, 2000);
    }
</script>

</body>
</html>
