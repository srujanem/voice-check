<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Custom Frontend</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; padding: 50px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #bb86fc; }
        input[type="file"] { margin: 20px 0; padding: 10px; background: #2c2c2c; border-radius: 6px; }
        button { background-color: #bb86fc; color: black; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #9965f4; }
        #result { margin-top: 20px; font-size: 18px; padding: 15px; border-radius: 8px; display: none; }
        .ai-result { background-color: rgba(255, 82, 82, 0.2); border: 1px solid #ff5252; color: #ff8a80; }
        .human-result { background-color: rgba(76, 175, 80, 0.2); border: 1px solid #4caf50; color: #b9f6ca; }
    </style>
</head>
<body>

<div class="container">
    <h1>My AI vs Human Detector</h1>
    <p>Upload an image to check if it's AI or Human. This connects directly to the backend!</p>
    
    <input type="file" id="imageInput" accept="image/*">
    <br>
    <button onclick="detectImage()">Analyze Image</button>

    <div id="result"></div>
</div>

<script>
// The API Key we generated on the backend
const API_KEY = "ais_8f293b4a2e5c89d107a6f2b1d3e8a49c";

async function detectImage() {
    const fileInput = document.getElementById('imageInput');
    const resultDiv = document.getElementById('result');
    
    if (fileInput.files.length === 0) {
        alert("Please select an image first!");
        return;
    }
    
    resultDiv.style.display = "block";
    resultDiv.className = "";
    resultDiv.innerText = "Analyzing... Please wait...";

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    try {
        const response = await fetch("http://localhost:8000/api/image/detect", {
            method: "POST",
            headers: {
                "X-API-Key": API_KEY 
            },
            body: formData
        });
        
        const data = await response.json();
        
        if (response.ok) {
            const isAI = data.prediction === "AI";
            resultDiv.className = isAI ? "ai-result" : "human-result";
            resultDiv.innerHTML = `
                <strong>Prediction:</strong> ${data.prediction}<br>
                <strong>AI Probability:</strong> ${(data.ai_probability * 100).toFixed(1)}%<br>
                <strong>Human Probability:</strong> ${(data.human_probability * 100).toFixed(1)}%
            `;
        } else {
            resultDiv.innerHTML = `Error: ${data.detail}`;
            resultDiv.className = "ai-result";
        }
    } catch (error) {
        resultDiv.innerHTML = "Failed to connect to backend server. Is it running?";
        resultDiv.className = "ai-result";
    }
}
</script>

</body>
</html>
