<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Launching AuthGuard...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #f1f5f9;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
            flex-direction: column; gap: 20px;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(0,243,255,0.2);
            border-top-color: #00f3ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { font-size: 20px; font-weight: 700; }
        p  { color: #64748b; font-size: 14px; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>Connecting to AuthGuard...</h2>
    <p id="msg">Clearing cached settings and finding server...</p>
    <script>
        // ── Clear any stale/dead tunnel URLs from localStorage ──────────────
        localStorage.removeItem('zrok_url');
        localStorage.removeItem('server_online');

        // ── Detect best working backend URL ─────────────────────────────────
        const ports = ['http://localhost:5000'];
        const target = '/voice-ui/index.html';   // Change this if needed

        async function tryPort(url) {
            try {
                const r = await fetch(url + '/api/health', { signal: AbortSignal.timeout(2000) });
                return r.ok;
            } catch { return false; }
        }

        (async () => {
            for (const base of ports) {
                document.getElementById('msg').textContent = `Trying ${base}...`;
                if (await tryPort(base)) {
                    localStorage.setItem('zrok_url', base);
                    window.location.href = base + target;
                    return;
                }
            }
            document.getElementById('msg').textContent =
                '❌ Server not found! Make sure the AuthGuard Control Panel is running.';
        })();
    </script>
</body>
</html>
