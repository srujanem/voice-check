<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Training | Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../global.css">
    <style>
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding: 40px 20px;
            font-family: 'Inter', sans-serif;
        }
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .card h2 {
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h2 i {
            color: var(--accent-cyan);
        }
        .action-row {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .console {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 16px;
            font-family: monospace;
            color: #38bdf8;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-top: 20px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* ── External DB Styles ── */
        .ext-db-toggle {
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--bg-hover); color: var(--text-secondary);
            border: 1px solid var(--border-color); padding: 10px 16px;
            border-radius: 10px; cursor: pointer; font-weight: 500;
            font-size: 13px; font-family: inherit; transition: all 0.25s ease;
        }
        .ext-db-toggle:hover { color: var(--text-primary); border-color: var(--accent-cyan); }
        .ext-db-toggle .chevron { transition: transform 0.3s ease; font-size: 11px; }
        .ext-db-toggle.open .chevron { transform: rotate(180deg); }

        .ext-db-body {
            max-height: 0; overflow: hidden; transition: max-height 0.4s ease, opacity 0.3s ease;
            opacity: 0;
        }
        .ext-db-body.open { max-height: 320px; opacity: 1; }

        .ext-db-form { padding-top: 16px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-family: inherit; font-size: 14px; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: var(--accent-cyan); box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2); }

        .ext-db-connect-btn {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white; font-size: 15px; font-weight: 600; font-family: inherit;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(245, 158, 11, 0.3);
        }
        .ext-db-connect-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(245, 158, 11, 0.4); }
        .ext-db-connect-btn:active { transform: translateY(0); }

        .ext-db-status {
            margin-top: 12px; padding: 8px 12px; border-radius: 8px;
            font-size: 12px; text-align: center; display: none;
        }
        .ext-db-status.success {
            display: block; color: #22c55e;
            background: rgba(34, 197, 94, 0.08); border: 1px solid rgba(34, 197, 94, 0.15);
        }
        .ext-db-status.error {
            display: block; color: #ef4444;
            background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.15);
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="header">
            <h1><i class="fa-solid fa-brain"></i> Model Training Hub</h1>
            <a href="../index.html" class="btn-secondary"><i class="fa-solid fa-house"></i> Back to Home</a>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-database"></i> External Data Pipeline</h2>
            <p style="color: var(--text-secondary);">Sync datasets from the VKServer database to your local environment for training.</p>
            <div class="action-row">
                <button class="btn-primary" id="btn-sync"><i class="fa-solid fa-cloud-arrow-down"></i> Sync Data from External DB</button>
            </div>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-microchip"></i> Training Engines</h2>
            <p style="color: var(--text-secondary);">Run the local ML scripts to update the deepfake detection models.</p>
            
            <div class="form-group" style="margin-top: 15px;">
                <label>Zrok Tunnel URL (Optional - For Remote Training)</label>
                <input type="text" id="zrok-tunnel-url" placeholder="https://xxxx.share.zrok.io (Leave blank if running on the same PC)">
            </div>

            <div class="action-row">
                <button class="btn-primary" id="btn-train-voice" style="background: linear-gradient(135deg, #8b5cf6, #d946ef);"><i class="fa-solid fa-microphone"></i> Train Voice Model</button>
                <button class="btn-primary" id="btn-train-image" style="background: linear-gradient(135deg, #3b82f6, #06b6d4);"><i class="fa-solid fa-image"></i> Train Image Model</button>
                <button class="btn-primary" id="btn-train-text" style="background: linear-gradient(135deg, #10b981, #3b82f6);"><i class="fa-solid fa-file-lines"></i> Train Text Model</button>
            </div>
            
            <div class="console" id="terminal">System initialized. Waiting for commands...</div>
        </div>
    </div>

    <script src="../server-config.js?v=4"></script>
    <script type="module">
        const term = document.getElementById('terminal');

        function log(msg, type = 'info') {
            const colors = { info: '#06b6d4', success: '#10b981', error: '#ef4444', warn: '#f59e0b' };
            term.innerHTML += `\n<span style="color:${colors[type] || '#cbd5e1'}">› ${msg}</span>`;
            term.scrollTop = term.scrollHeight;
        }

        async function runTrain(modelType) {

            // Auto-use the saved Zrok URL, or fall back to localhost
            const zrokInput = document.getElementById('zrok-tunnel-url');
            const manualUrl = zrokInput && zrokInput.value.trim();
            const baseUrl   = manualUrl || localStorage.getItem('zrok_url') || 'http://localhost:8000';

            log(`Sending ${modelType} training request to ${baseUrl} ...`, 'warn');

            try {
                const res = await fetch(`${baseUrl}/api/train`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ type: modelType, epochs: 10 })
                });

                const json = await res.json();
                if (res.ok) {
                    log(`Training job dispatched! Your RTX 4050 is now running ${modelType} training for 10 epochs.`, 'success');
                    log(`Check the AI Training Panel desktop app → Monitor tab to see live GPU usage.`, 'info');
                } else {
                    log('Error: ' + (json.error || 'Request failed.'), 'error');
                }
            } catch (err) {
                log('Cannot reach server: ' + err.message, 'error');
                log('Make sure the Node Server is running in the AI Training Panel desktop app!', 'warn');
            }
        }

        document.getElementById('btn-sync').onclick = () => {
            log('Add your training data to these folders on your PC:', 'info');
            log('Voice (Human) → C:\\voice-check\\dataset\\human\\  (.wav .mp3 .flac)', 'info');
            log('Voice (AI)    → C:\\voice-check\\dataset\\ai\\      (.wav .mp3 .flac)', 'info');
            log('Image (Real)  → C:\\voice-check\\dataset_image\\real\\  (.jpg .png)', 'info');
            log('Image (Fake)  → C:\\voice-check\\dataset_image\\fake\\  (.jpg .png)', 'info');
            log('Then click Train Voice Model or Train Image Model!', 'success');
        };

        document.getElementById('btn-train-voice').onclick  = () => runTrain('voice');
        document.getElementById('btn-train-image').onclick  = () => runTrain('image');
        document.getElementById('btn-train-text').onclick   = () => runTrain('text');
    </script>
</body>
</html>
