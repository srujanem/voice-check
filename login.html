<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Login - AuthGuard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="global.css?v=6">
    <style>
        * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: max(60px, calc(env(safe-area-inset-top, 0px) + 20px)) 20px 20px; }

        .auth-wrapper { width: 100%; max-width: 420px; animation: fadeSlideUp 0.5s ease-out; }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-container {
            background: var(--bg-card);
            padding: 36px 32px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 24px 48px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.05) inset;
            backdrop-filter: blur(20px);
        }

        .auth-header { text-align: center; margin-bottom: 28px; }
        .auth-header .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 14px;
            display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(6, 182, 212, 0.3);
        }
        .auth-header .logo-icon i { font-size: 22px; color: white; }
        .auth-header h2 { margin: 0 0 4px; font-size: 22px; font-weight: 700; color: var(--text-primary); }
        
        .auth-tabs { display: flex; gap: 8px; margin-bottom: 24px; background: rgba(0,0,0,0.1); padding: 4px; border-radius: 12px; }
        .auth-tab { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-secondary); font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 8px; transition: all 0.2s; }
        .auth-tab.active { background: var(--bg-hover); color: var(--text-primary); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--text-secondary); font-size: 13px; font-weight: 500; }
        .form-group input {
            width: 100%; padding: 11px 14px; border-radius: 10px;
            border: 1px solid var(--border-color); background: var(--bg-hover);
            color: var(--text-primary); font-family: inherit; font-size: 14px;
            transition: all 0.2s ease;
        }
        .form-group input:focus {
            outline: none; border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
        }

        #error-message {
            color: #ef4444; font-size: 12px; margin-bottom: 12px;
            padding: 8px 12px; background: rgba(239,68,68,0.08);
            border-radius: 8px; border: 1px solid rgba(239,68,68,0.15);
        }

        #success-message {
            color: #10b981; font-size: 12px; margin-bottom: 12px;
            padding: 8px 12px; background: rgba(16, 185, 129, 0.08);
            border-radius: 8px; border: 1px solid rgba(16, 185, 129, 0.15);
        }

        .submit-btn {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: white; font-size: 15px; font-weight: 600; font-family: inherit;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(6, 182, 212, 0.3);
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(6, 182, 212, 0.4); }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        .back-link {
            position: fixed;
            top: max(20px, env(safe-area-inset-top, 20px));
            left: max(20px, env(safe-area-inset-left, 20px));
            color: var(--text-secondary); text-decoration: none;
            font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px;
            transition: color 0.2s;
            z-index: 200;
        }
        .back-link:hover { color: var(--text-primary); }
    </style>
</head>
<body>
    <div class="theme-toggle" id="themeToggle"><i class="fa-solid fa-sun"></i></div>
    <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="auth-header">
                <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
                <h2 id="auth-title">Welcome Back</h2>
            </div>
            
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
                <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
            </div>

            <form id="auth-form">
                <div class="form-group" id="email-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                
                <div class="form-group" id="password-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <div class="form-group" id="otp-group" style="display: none;">
                    <label>Enter OTP</label>
                    <input type="text" id="otp" placeholder="123456" maxlength="6">
                </div>

                <div id="error-message" style="display: none;"></div>
                <div id="success-message" style="display: none;"></div>

                <button type="submit" id="submit-btn" class="submit-btn">Login</button>
            </form>
        </div>
    </div>

    <script src="theme.js"></script>
    <script>
        const form = document.getElementById('auth-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const otpInput = document.getElementById('otp');
        const passwordGroup = document.getElementById('password-group');
        const otpGroup = document.getElementById('otp-group');
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-message');
        const successMsg = document.getElementById('success-message');
        const title = document.getElementById('auth-title');
        
        let mode = 'login'; // 'login' or 'signup'
        let signupStep = 1; // 1: Email, 2: OTP + Password

        const API_KEY = 'sk_test_CRlzyngFryWvSo0kA06JpI1tDPFTZgL5';
        const BASE_URL = 'https://vkserver.vercel.app/api/db';

        function switchTab(newMode) {
            mode = newMode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            emailInput.disabled = false;
            
            if (mode === 'login') {
                title.innerText = 'Welcome Back';
                passwordGroup.style.display = 'block';
                passwordInput.required = true;
                otpGroup.style.display = 'none';
                otpInput.required = false;
                submitBtn.innerText = 'Login';
            } else {
                title.innerText = 'Create Account';
                signupStep = 1;
                passwordGroup.style.display = 'none';
                passwordInput.required = false;
                otpGroup.style.display = 'none';
                otpInput.required = false;
                submitBtn.innerText = 'Send OTP';
            }
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            const email = emailInput.value.trim();

            if (mode === 'login') {
                const password = passwordInput.value;
                submitBtn.innerText = 'Logging in...';
                submitBtn.disabled = true;
                
                try {
                    const res = await fetch(`${BASE_URL}/auth/login`, {
                        method: 'POST',
                        headers: { 
                            'x-api-key': API_KEY,
                            'Content-Type': 'application/json' 
                        },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.message || data.error || 'Login failed');
                    
                    localStorage.setItem('api_key', data.token || API_KEY);
                    localStorage.setItem('user_id', email);
                    localStorage.setItem('user_name', email);
                    
                    successMsg.innerText = 'Login successful! Redirecting...';
                    successMsg.style.display = 'block';
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } catch (err) {
                    errorMsg.innerText = err.message;
                    errorMsg.style.display = 'block';
                    submitBtn.innerText = 'Login';
                } finally {
                    submitBtn.disabled = false;
                }
            } else if (mode === 'signup') {
                if (signupStep === 1) {
                    submitBtn.innerText = 'Sending...';
                    submitBtn.disabled = true;
                    
                    try {
                        const res = await fetch(`${BASE_URL}/auth/signup`, {
                            method: 'POST',
                            headers: { 
                                'x-api-key': API_KEY,
                                'Content-Type': 'application/json' 
                            },
                            body: JSON.stringify({ email })
                        });
                        
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.message || data.error || 'Failed to send OTP');
                        
                        successMsg.innerText = `OTP sent to ${email}`;
                        successMsg.style.display = 'block';
                        
                        emailInput.disabled = true;
                        otpGroup.style.display = 'block';
                        otpInput.required = true;
                        passwordGroup.style.display = 'block';
                        passwordInput.required = true;
                        submitBtn.innerText = 'Verify & Create Account';
                        signupStep = 2;
                    } catch (err) {
                        errorMsg.innerText = err.message;
                        errorMsg.style.display = 'block';
                        submitBtn.innerText = 'Send OTP';
                    } finally {
                        submitBtn.disabled = false;
                    }
                } else if (signupStep === 2) {
                    const otp = otpInput.value.trim();
                    const password = passwordInput.value;
                    submitBtn.innerText = 'Verifying...';
                    submitBtn.disabled = true;
                    
                    try {
                        const res = await fetch(`${BASE_URL}/auth/verify`, {
                            method: 'POST',
                            headers: { 
                                'x-api-key': API_KEY,
                                'Content-Type': 'application/json' 
                            },
                            body: JSON.stringify({ email, otp, password })
                        });
                        
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.message || data.error || 'Verification failed');
                        
                        localStorage.setItem('api_key', data.token || API_KEY);
                        localStorage.setItem('user_id', email);
                        localStorage.setItem('user_name', email);
                        
                        successMsg.innerText = 'Account created successfully! Redirecting...';
                        successMsg.style.display = 'block';
                        setTimeout(() => window.location.href = 'index.html', 1000);
                    } catch (err) {
                        errorMsg.innerText = err.message;
                        errorMsg.style.display = 'block';
                        submitBtn.innerText = 'Verify & Create Account';
                    } finally {
                        submitBtn.disabled = false;
                    }
                }
            }
        };
    </script>
</body>
</html>
